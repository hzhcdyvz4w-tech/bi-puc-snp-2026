name: BI PUC - testes sintéticos

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "tools/test_documental_regressao.js"
      - "tools/browser_smoke.html"
      - "tools/browser_smoke_cdp.js"
      - ".github/workflows/bi-puc-smoke.yml"
  workflow_dispatch:

concurrency:
  group: bi-puc-smoke-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regressao:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Regressão documental em Node
        run: node tools/test_documental_regressao.js
      - name: Smoke funcional em Chrome headless
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/bi-puc-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium indisponível no runner"; exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-extensions --window-size=1600,1000 --remote-debugging-port=9222 --user-data-dir=/tmp/bi-puc-chrome-profile "http://127.0.0.1:8765/tools/browser_smoke.html" >/tmp/bi-puc-chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$CHROME_PID" "$SERVER_PID" 2>/dev/null || true' EXIT
          node tools/browser_smoke_cdp.js
