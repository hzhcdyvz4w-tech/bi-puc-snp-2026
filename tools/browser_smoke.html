<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><title>Teste funcional sintético BI PUC</title>
<body data-smoke-status="RUNNING"><h1>Teste funcional do BI PUC — somente dados artificiais</h1>
<pre id="log">Iniciando...</pre><iframe id="app" src="../index.html" style="width:1400px;height:900px;position:relative;left:0;top:0" title="BI PUC"></iframe>
<script>
(async()=>{
 const log=document.getElementById('log');let passes=0,failures=0;
 const write=(ok,label,details='')=>{passes+=!!ok;failures+=!ok;log.textContent+=(ok?'PASS ':'FAIL ')+label+(details?' — '+details:'')+'\n'};
 const assert=(condition,label,details='')=>{write(!!condition,label,details);if(!condition)throw Error(label)};
 const sleep=ms=>new Promise(r=>setTimeout(r,ms));
 const until=async(check,ms=14000)=>{const start=Date.now();while(Date.now()-start<ms){try{if(check())return true}catch(e){}await sleep(100)}return false};
 const frame=document.getElementById('app');
 const w=frame.contentWindow,d=()=>frame.contentDocument;
 try{
  log.textContent='';
  const ready=await until(()=>d()?.getElementById('puc3-central-files')&&d()?.getElementById('puc-library-count')&&w.PUCDocLibrary?.list,25000);
  const info=()=>{try{return JSON.stringify({readyState:d()?.readyState,url:w.location.href,central:!!d()?.getElementById('puc3-central-files'),library:!!w.PUCDocLibrary,libraryCount:!!d()?.getElementById('puc-library-count'),libraryPanel:!!d()?.getElementById('puc-library'),libraryError:w.PUCDocLibrary?.storageError||d()?.getElementById('puc-library-error')?.textContent||'',indexedDB:!!w.indexedDB,nav:!!d()?.getElementById('nav'),bodyLength:d()?.body?.innerHTML?.length})}catch(e){return 'iframe indisponível: '+e.message}};
  assert(ready, 'Inicialização dos módulos e da biblioteca',info());
  const docs=d().getElementById('documentos'),compare=d().getElementById('comparacao');
  const central=d().getElementById('puc3-central-files'),uploads=d().getElementById('puc3-uploads');
  assert(docs.contains(central)&&central.contains(uploads)&&!compare.contains(uploads),'Anexos somente em Documentos');
  const ids=['puc3-files-SEI','puc3-files-BALANCO','puc3-files-SIOP'];
  assert(ids.every(id=>d().querySelectorAll('#'+id).length===1&&central.contains(d().getElementById(id))),'Três fontes com IDs únicos');
  const other=[...d().querySelectorAll('input[type=file]')].filter(el=>!central.contains(el)&&w.getComputedStyle(el).display!=='none'&&w.getComputedStyle(el.closest('label')||el).display!=='none'&&!el.closest('[hidden]'));
  assert(other.length===0,'Nenhum outro campo de anexo visível',String(other.length));
  assert(d().querySelectorAll('#puc3-projects input[type=checkbox]').length===12,'12 PUCs selecionáveis');
  const first=d().querySelector('#puc3-projects input[value="PUC-01"]');first.click();
  assert(d().getElementById('puc3-selected').textContent.startsWith('1 PUC'),'Seleção individual');
  d().getElementById('puc3-all').click();
  assert(d().getElementById('puc3-selected').textContent.startsWith('12 PUC'),'Seleção de todas');
  d().getElementById('puc3-clear').click();
  assert(d().getElementById('puc3-selected').textContent.startsWith('0 PUC'),'Limpar seleção');
  assert(!!d().getElementById('puc3-compare-status'),'Feedback visível no Confronto');
  assert(!!w.JSZip,'JSZip disponível no navegador');
  const zip=new w.JSZip();
  zip.file('BM_05_Medicao.html','<html><body><h1>Boletim de Medição nº 05</h1><p>Competência: 09/2026</p><p>Valor medido no período: R$ 1.234,56</p></body></html>');
  zip.file('Despacho_323.html','<html><body>Despacho que menciona Boletim de Medição 05.</body></html>');
  const file=new w.File([await zip.generateAsync({type:'blob'})],'PROCESSO_TESTE_SEI.zip',{type:'application/zip'});
  const input=d().getElementById('puc3-files-SEI'),dt=new w.DataTransfer();dt.items.add(file);input.files=dt.files;
  d().getElementById('puc3-project-SEI').value='PUC-01';
  d().getElementById('puc3-ref-SEI').value='SEI-TESTE-NAO-OFICIAL';
  d().querySelector('[data-import="SEI"]').click();
  assert(await until(()=>w.PUCDocLibrary.list().filter(x=>x.origin==='SEI').length===2),'ZIP SEI com dois documentos registrado',d().getElementById('puc3-status').textContent);
  const entries=w.PUCDocLibrary.list().filter(x=>x.origin==='SEI');
  assert(entries.some(x=>x.bmStatus==='BM IDENTIFICADO')&&entries.some(x=>x.bmStatus==='BM MENCIONADO'),'BM distinguido de despacho');
  const addCSV=async(source,name,body)=>{
   const inp=d().getElementById('puc3-files-'+source),dt=new w.DataTransfer();
   dt.items.add(new w.File([body],name,{type:'text/csv'}));inp.files=dt.files;
   d().getElementById('puc3-project-'+source).value='PUC-01';
   d().getElementById('puc3-ref-'+source).value='TESTE-SINTETICO';
   d().querySelector('[data-import="'+source+'"]').click();
   return until(()=>w.PUCDocLibrary.list().some(x=>x.origin===source));
  };
  assert(await addCSV('BALANCO','balanco_teste.csv','Empreendimento;Execução física\nPUC-01;20%'),'Balanço sintético importado');
  assert(await addCSV('SIOP','siop_teste.csv','Dotação atual;Empenhado\n1000;800'),'SIOP sintético importado');
  assert(w.PUCDocLibrary.list().length===4,'Quatro documentos nas três fontes');
  const lib=w.PUCDocLibrary,all=lib.list(),bmDoc=all.find(x=>x.origin==='SEI'&&x.bmStatus==='BM IDENTIFICADO'),balDoc=all.find(x=>x.origin==='BALANCO');
  const finding={project:'PUC-01',indicator:'medicao_bm',value:1234.56,period:'2026-09',cutoff:'2026-09-30',aggregation:'MENSAL',object:'CONTRATO',contract:'123/2026',bmNumber:'05',verified:true,note:'Teste sintético de confronto'};
  await lib.saveFinding(bmDoc.id,{...finding});
  await lib.saveFinding(balDoc.id,{...finding,bmNumber:'5'});
  d().querySelector('#puc3-projects input[value="PUC-01"]').click();
  d().getElementById('puc3-run').click();
  assert(d().getElementById('puc3-result').textContent.includes('CORRESPONDÊNCIA'),'Confronto de duas fontes equivalentes',JSON.stringify({selected:d().getElementById('puc3-selected').textContent,files:lib.list().map(x=>({origin:x.origin,project:x.project,findings:x.findings})),result:d().getElementById('puc3-result').textContent.slice(0,1400)}));
  let fid=lib.list().find(x=>x.id===balDoc.id).findings[0].id;
  await lib.saveFinding(balDoc.id,{...finding,id:fid,value:1300});
  d().getElementById('puc3-run').click();
  assert(d().getElementById('puc3-result').textContent.includes('DIVERGÊNCIA'),'Divergência de valor no confronto');
  await lib.saveFinding(balDoc.id,{...finding,id:fid,bmNumber:'06'});
  d().getElementById('puc3-run').click();
  assert(d().getElementById('puc3-result').textContent.includes('NÃO COMPARÁVEL'),'BM diferente bloqueia comparação');
  await lib.saveFinding(balDoc.id,{...finding,id:fid});
  d().getElementById('puc3-report-preview-btn').click();
  const preview=d().getElementById('puc3-report-preview').textContent;
  assert(preview.includes('CORRESPONDÊNCIA'),'Prévia do relatório documental');
  assert(d().getElementById('puc3-result').textContent.includes('BM_05_Medicao.html'),'Confronto preserva nome do arquivo');
  const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
  w.location.reload();await loaded;
  assert(await until(()=>w.PUCDocLibrary?.list?.().length===4&&d().getElementById('puc-library-count')),'Persistência IndexedDB após recarregar');
  d().querySelector('#nav [data-page="comparacao"]').click();
  assert(!d().getElementById('comparacao').classList.contains('hidden'),'Navegação Confronto');
  d().querySelector('#nav [data-page="documentos"]').click();
  assert(!d().getElementById('documentos').classList.contains('hidden'),'Navegação Documentos');
  w.confirm=()=>true;
  d().getElementById('puc-delete-all').click();
  assert(await until(()=>w.PUCDocLibrary.list().length===0),'Exclusão local de documentos');
  document.body.setAttribute('data-smoke-status','PASS');
 }catch(err){log.textContent+='ERRO: '+String(err?.stack||err)+'\n';document.body.setAttribute('data-smoke-status','FAIL')}
 log.textContent+='RESULTADO: '+passes+' aprovados, '+failures+' falhas\n';
})();
</script>
</body></html>
